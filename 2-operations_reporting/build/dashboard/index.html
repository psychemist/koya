    const chips = el('div', 'chips');
    entityChip(opts.entity, chips);
    n.appendChild(chips);
  }
  host.appendChild(n);
}

function departmentCard(host, dep) {
  const c = el('div', 'dept-card');
  c.appendChild(el('div', 'kicker', DOMAIN_LABEL[dep.area] || dep.area));
  c.appendChild(el('div', 'headline', dep.headline || ''));
  c.appendChild(el('p', null, dep.assessment || ''));

  const point = (key, val) => {
    if (!val) return;
    const row = el('div', 'pt');
    row.appendChild(el('div', 'pt-key', key));
    row.appendChild(el('div', 'pt-val', val));
    c.appendChild(row);
  };
  point('Working', dep.what_is_working);
  point('Watch', dep.what_needs_attention);
  point('Do next', dep.priority_action);

  if (Array.isArray(dep.focus_entities) && dep.focus_entities.length) {
    const chips = el('div', 'chips');
    dep.focus_entities.forEach((name) => entityChip(name, chips));
    c.appendChild(chips);
  }
  host.appendChild(c);
}

function renderInsights(main, filter) {
  const d = state.data;
  const ins = state.model.insights;
  const c = card(main, filter ? 'What the analysis says' : 'AI analysis');

  const model = parseModelName(d.model);

  c.appendChild(el('div', 'sub', d.insight_source === 'claude'
    ? 'Written by ' + model + ' from the calculated figures above. Every number below was checked against those figures before this page rendered.'
    : 'Generated by the workflow’s rules-based fallback, because the model call did not complete.'));

  if (!filter) {
    const p = el('p', 'summary', ins.summary || 'No summary was produced for this run.');
    p.style.marginTop = '12px';
    c.appendChild(p);

    c.appendChild(el('h3', null, 'Read this if you run…'));
    const grid = el('div', 'grid cols-3');
    if (!ins.departments.length) {
      grid.appendChild(el('div', 'empty', 'No department sections were returned for this run.'));
    }
    ins.departments.forEach((dep) => departmentCard(grid, dep));
    c.appendChild(grid);
  } else {
    const dep = ins.departments.filter((x) => x.area === filter.domain)[0];
    if (dep) {
      const grid = el('div', 'grid');
      grid.style.marginTop = '12px';
      departmentCard(grid, dep);
      c.appendChild(grid);
    }
  }

  const match = (x) => {
    if (!filter) return true;
    if (x.entity && x.entity === filter.entity) return true;
    return x.area === filter.domain && !x.entity;
  };

  const risks = ins.risks.filter(match);
  const actions = ins.actions.filter(match);

  c.appendChild(el('h3', null, filter ? 'Risks that touch ' + filter.entity : 'Operational risks and anomalies'));
  if (!risks.length) {
    c.appendChild(el('div', 'muted', filter
      ? 'Nothing was raised against ' + filter.entity + ' for this period.'
      : 'No operational risks or anomalies were identified for this period.'));
  }
  risks.forEach((r) => insightItem(c, {
    level: r.severity || 'low',
    metaText: (r.severity || '') + ' · ' + (DOMAIN_LABEL[r.area] || String(r.area).replace(/_/g, ' ')),
    head: r.finding,
    body: r.evidence,
    entity: filter ? null : r.entity,
  }));

  c.appendChild(el('h3', null, filter ? 'Actions for ' + filter.entity : 'Recommended actions'));
  if (!actions.length) {
    c.appendChild(el('div', 'muted', filter
      ? 'No actions were recommended for ' + filter.entity + '.'
      : 'No actions were recommended for this period.'));
  }
  actions.forEach((a) => insightItem(c, {
    level: a.priority || 'low',
    metaText: (a.priority || '') + ' priority · ' + (DOMAIN_LABEL[a.area] || String(a.area).replace(/_/g, ' ')),
    head: a.action,
    body: a.rationale,
    entity: filter ? null : a.entity,
  }));

  if (!filter && ins.aiDq.length) {
    c.appendChild(el('h3', null, 'Where the analyst is less confident'));
    ins.aiDq.forEach((w) => insightItem(c, {
      level: 'low',
      metaText: DOMAIN_LABEL[w.source] || String(w.source || '').replace(/_/g, ' '),
      head: w.issue,
      body: w.impact,
    }));
  }
}

  const row = entityRow(view.domain, view.name);
  const S1 = () => cssVar('--series-1');

  if (view.domain === 'sales') {
    tiles(head, [
      ['Revenue won', asMetric(row.revenue_won), fmtMoney],
      ['Leads', asMetric(row.leads), fmtInt],
      ['Closed won', asMetric(row.closed_won), fmtInt],
      ['Closed lost', asMetric(row.closed_lost), fmtInt],
      ['Win rate', asMetric(row.win_rate), fmtPct],
      ['Open deals', asMetric(row.open_deals), fmtInt],
      ['Open pipeline', asMetric(row.pipeline_value), fmtMoney],
      ['Average won deal', asMetric(row.average_won_deal), fmtMoney],
      ['Share of revenue', asMetric(row.share_of_revenue), fmtPct],
    ]);
  } else if (view.domain === 'project_delivery') {
    tiles(head, [
      ['Total load', asMetric(row.total_load), fmtInt],
      ['Active', asMetric(row.active), fmtInt],
      ['Blocked', asMetric(row.blocked), fmtInt],
      ['Completed', asMetric(row.completed), fmtInt],
      ['On-time rate', asMetric(row.on_time_rate), fmtPct],
      ['Average delay', asMetric(row.average_delay_days), fmtDays],
      ['Worst delay', asMetric(row.worst_delay_days), fmtDays],
      ['Budget variance', asMetric(row.budget_variance), fmtMoney],
      ['Over budget', asMetric(row.over_budget), fmtInt],
    ]);
  } else {
    tiles(head, [
      ['Active headcount', asMetric(row.active_headcount), fmtInt],
      ['Opening headcount', asMetric(row.opening_headcount), fmtInt],
      ['Change', asMetric(row.headcount_change), fmtInt],
      ['New hires', asMetric(row.new_hires), fmtInt],
      ['Exits', asMetric(row.exits), fmtInt],
      ['Attrition rate', asMetric(row.attrition_rate), fmtPct],
      ['Applications', asMetric(row.applications), fmtInt],
      ['Time to hire', asMetric(row.time_to_hire_days), fmtDays],
      ['Accepted, not started', asMetric(row.accepted_not_started), fmtInt],
    ]);

  // ---- where this one sits against the others

  compare.appendChild(g);

  if (view.domain === 'sales') {

    chartCard(g, {
      title: 'Revenue won by lead source',
      note: view.name + ' is highlighted; the other sources are shown for scale.',
      draw: (host, w) => hBars(host, w, {
        rows: list.map((x) => ({ label: x.lead_source, value: x.revenue_won })),
        format: fmtMoney,
        highlight: view.name,
        valueName: 'revenue won',
      }),
      table: () => ({
        columns: ['Lead source', 'Revenue won', 'Leads', 'Win rate'],
        rows: list.map((x) => [x.lead_source, fmtMoney(x.revenue_won), x.leads, fmtPct(x.win_rate)]),
      }),
    });
  } else if (view.domain === 'project_delivery') {
    const list = breakdowns['project_delivery.delivery_load_by_team'] || [];
    chartCard(g, {
      title: 'Delivery load by team',
      note: view.name + ' is highlighted; bar length is total load in this window.',
      draw: (host, w) => hBars(host, w, {
        rows: list.map((x) => ({
          label: x.team,
          value: x.total_load,
          detail: [
            { name: 'active', value: String(x.active) },
            { name: 'blocked', value: String(x.blocked) },
            { name: 'completed', value: String(x.completed) },
          ],
        })),
        format: fmtInt,
        highlight: view.name,
        valueName: 'projects',
      }),
      table: () => ({
        columns: ['Team', 'Total load', 'Active', 'Blocked', 'Completed'],
        rows: list.map((x) => [x.team, x.total_load, x.active, x.blocked, x.completed]),
      }),
    });
  } else {
    const list = breakdowns['people_ops.headcount_by_department'] || [];
    chartCard(g, {
      title: 'Active headcount by department',
      note: view.name + ' is highlighted; the other departments are shown for scale.',
      draw: (host, w) => hBars(host, w, {
        rows: list.map((x) => ({ label: x.department, value: x.active_headcount })),
        format: fmtInt,
        highlight: view.name,
        valueName: 'people',
      }),
      table: () => ({
        columns: ['Department', 'Headcount', 'Hires', 'Exits', 'Attrition'],
        rows: list.map((x) => [x.department, x.active_headcount, x.new_hires, x.exits, fmtPct(x.attrition_rate)]),
      }),
    });
  }

  // ---- the named work behind the counts
  if (view.domain === 'project_delivery') {
    const detail = card(main, 'The work behind the numbers');
    const blocked = row.blocked_items || [];
    const late = row.late_items || [];

    detail.appendChild(el('h3', null, 'Blocked projects'));
    if (!blocked.length) detail.appendChild(el('div', 'muted', 'Nothing on ' + view.name + ' is blocked.'));
    else detail.appendChild(buildTable({
      columns: ['Project', 'Owner', 'Due'],
      rows: blocked.map((p) => [p.project_name || p.project_id, p.owner || '—', p.due_date ? fmtDate(p.due_date) : 'no due date']),
    }));

    detail.appendChild(el('h3', null, 'Completed late in this window'));
    if (!late.length) detail.appendChild(el('div', 'muted', 'Nothing on ' + view.name + ' completed late in this window.'));
    else detail.appendChild(buildTable({
      columns: ['Project', 'Owner', 'Days late'],
      rows: late.map((p) => [p.project_name || p.project_id, p.owner || '—', Math.round(p.delay_days)]),
    }));

    if (row.missing_due_date || row.missing_cost) {
      detail.appendChild(el('div', 'sub',
        [row.missing_due_date ? row.missing_due_date + ' completed project(s) have no due date, so they are outside the on-time rate.' : '',
         row.missing_cost ? row.missing_cost + ' have no actual cost, so they are outside budget variance.' : ''
        ].filter(Boolean).join(' ')));
    }

    const owners = row.owners || [];
    if (owners.length) {
      detail.appendChild(el('h3', null, 'Owners on this team in this window'));
      // Scoped to this team's card: every owner on screen at once is a
      // distinct hue, which is what the reader actually needs here. An owner
      // who appears under two teams is not promised the same colour in both.
      const scope = 'owners:' + view.name;
      registerHues(scope, owners);
      const chips = el('div', 'chips');
      owners.forEach((o) => chips.appendChild(chipEl(o, scope, 'static')));
      detail.appendChild(chips);
    }
  }

  if (view.domain === 'people_ops' && (row.roles || []).length) {
    const detail = card(main, 'Roles in this department');
    const scope = 'roles:' + view.name;
    registerHues(scope, row.roles);
    const chips = el('div', 'chips');
    row.roles.forEach((r) => chips.appendChild(chipEl(r, scope, 'static')));
    detail.appendChild(chips);
    if (row.accepted_not_started) {
      detail.appendChild(el('div', 'sub', row.accepted_not_started +
        ' accepted offer(s) in this department start after the period ends, so they are not in the headcount above.'));
    }
  }

  if (view.domain === 'sales' && row.deals_missing_amount) {
    const detail = card(main, 'What is missing');
    detail.appendChild(el('div', 'sub', row.deals_missing_amount +
      ' closed-won deal(s) from ' + view.name + ' have no deal amount, so revenue won for this source is understated.'));
  }

  renderInsights(main, { domain: view.domain, entity: view.name });
  renderDataQuality(main, view.domain);
}

// ---- export -------------------------------------------------
function csvCell(v) {
  const s = v === null || v === undefined ? '' : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function csvRow(cells) { return cells.map(csvCell).join(','); }

function buildCsv() {
  const d = state.data;
  const out = [];

  out.push('# Koya Talent Operations Report');
  out.push(csvRow(['field', 'value']));
  [
    ['run_id', d.run_id], ['period', d.period_label], ['period_key', d.period_key],
    ['period_start', d.period_start], ['period_end', d.period_end], ['period_days', d.period_days],
    ['compared_with', d.compare_label], ['reference_date', d.reference_date],
    ['run_status', d.run_status], ['failed_sources', (d.failed_sources || []).join(' ')],
    ['insight_source', d.insight_source], ['model', d.model],
    ['confidence', d.confidence], ['grounded', d.grounded],
    ['updated_at', d.updated_at], ['exported_at', new Date().toISOString()],
  ].forEach((r) => out.push(csvRow(r)));

  out.push('');
  out.push('# Metrics');
  out.push(csvRow(['domain', 'metric', 'value', 'available', 'unavailable_reason',
    'previous_value', 'change', 'percent_change', 'direction']));
  (d.metrics || []).forEach((m) => out.push(csvRow([
    m.domain, m.metric_key, m.metric_value, m.is_available, m.unavailable_reason,
    m.previous_value, m.change, m.percent_change, m.direction])));

  out.push('');
  out.push('# Breakdowns');
  out.push(csvRow(['domain', 'breakdown', 'item', 'field', 'value']));
  (d.breakdowns || []).forEach((b) => {
    const v = b.values || {};
    Object.keys(v).forEach((k) => {
      const cell = v[k];
      if (cell !== null && typeof cell === 'object') return;   // nested lists live in the JSON export
      out.push(csvRow([b.domain, b.breakdown_key, b.item_key, k, cell]));
    });
  });

  out.push('');
  out.push('# Data quality (scoped to this reporting period)');
  out.push(csvRow(['severity', 'code', 'scope', 'source', 'record_id', 'record_date', 'message']));
  (d.data_quality || []).forEach((w) => out.push(csvRow([
    w.severity, w.code, w.scope, w.source, w.record_id, w.record_date, w.message])));

  return out.join('\n');
}

function download(filename, mime, text) {
  const blob = new Blob([text], { type: mime + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportName(ext) {
  const d = state.data;
  return 'koya-report_' + (d.period_key || 'period') + '_' + (d.period_end || '') + '.' + ext;
}

$('exportMenu').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-export]');
  if (!btn) return;
  $('exportMenu').open = false;
  if (!state.data) return notice('info', 'Nothing to export yet', 'Load a period first.');
  if (btn.dataset.export === 'csv') download(exportName('csv'), 'text/csv', buildCsv());
  else if (btn.dataset.export === 'json') download(exportName('json'), 'application/json', JSON.stringify(state.data, null, 2));
  else window.print();
});

// ---- run now ------------------------------------------------
// The period buttons only ever READ — they fetch whatever report is already
// stored. This is the only control that starts a run, so it is always here,
// and when the deployment has no webhook configured it says that rather than
// disappearing: a missing button reads as "this dashboard cannot refresh",
// which is a different and wronger message.
const runBtn = $('runBtn');
if (!N8N_WEBHOOK_URL) {
  runBtn.classList.remove('primary');
  runBtn.title = 'Refresh is not wired up on this deployment';
}

function setRunning(on, label) {
  runBtn.disabled = on;
  runBtn.setAttribute('aria-busy', String(on));
  clear(runBtn);
  if (on) runBtn.appendChild(el('span', 'spinner'));
  runBtn.appendChild(document.createTextNode(on ? (label || 'Running…') : 'Run now'));
}

async function triggerRun(body, opts) {
  const options = opts || {};
  setRunning(true, options.label);
  clear($('notices'));
  const started = Date.now();
  try {
    const res = await fetch(N8N_WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ requested_by: 'dashboard' }, body)),
    });
    if (!res.ok) throw new Error('n8n returned ' + res.status + ' ' + res.statusText);
    // A webhook that responds before the pipeline finishes, or an n8n error
    // page, will not be JSON. That is not a failed run, so do not report it
    // as one — fall through and reload, which shows the truth.
    let payload = null;
    try { payload = await res.json(); } catch (e) { payload = null; }
    await loadPeriod(body.period);
    const secs = Math.round((Date.now() - started) / 1000);
    if (payload && payload.status === 'unchanged') {
      notice('info', 'Nothing to update',
        'The source data has not changed since the last run for this period, so the report was ' +
        'left as it is and no analysis was re-run. That is the cost control working, not a failure.');
    } else {
      notice('ok', 'Report rebuilt', 'The workflow finished in ' + secs + ' seconds and this page is showing the new run.');
    }
  } catch (err) {
    notice('alert', 'Could not trigger the workflow',
      String((err && err.message) || err) +
      '. Check that the workflow is Active in n8n, that the webhook URL in the deployment config is the ' +
      'Production URL, and that the webhook node allows this page’s origin (CORS).');
  } finally {
    setRunning(false);
  }
}

runBtn.addEventListener('click', () => {
  if (!N8N_WEBHOOK_URL) {
    return notice('info', 'Refresh is not wired up on this deployment',
      'This page can start a run only when it knows the workflow’s webhook URL. Set N8N_WEBHOOK_URL — ' +
      'in .env locally, or as an Environment Variable on the Vercel project — and rebuild. Leaving it ' +
      'unset keeps the dashboard strictly read-only, which is the right setting for a page anyone can open: ' +
      'the URL is published to every visitor. Until then, run the workflow from n8n.');
  }
  if (state.period === 'custom') {
    return notice('info', 'Use the Custom panel to run a custom range',
      'A custom run needs the start and end dates, so it is started from the Run report button next to the date pickers.');
  }
  triggerRun({ period: state.period });
});

// ---- custom range -------------------------------------------
// A popover in the nav bar rather than a panel on the page, because the pickers
// are a way of asking a question and the report is the answer: once the question
// has been asked, they are between the reader and it. Every path that starts a
// run or loads a report closes them.
const customBtn = () => document.querySelector('#controls button[data-period="custom"]');

function closeCustom() {
  const panel = $('customPanel');
  if (!panel || panel.hidden) return;
  panel.hidden = true;
  const b = customBtn();
  if (b) b.setAttribute('aria-expanded', 'false');
}

function askCustom() {
  const panel = $('customPanel');
  const btn = customBtn();

  // Second click on Custom closes it, the way the Export menu behaves.
  if (!panel.hidden) return closeCustom();

  clear(panel);
  panel.appendChild(el('strong', null, 'Custom date range'));
  const row = el('div', 'row');
  const start = document.createElement('input');
  start.type = 'date';
  start.value = '2026-01-01';
  const end = document.createElement('input');
  end.type = 'date';
  end.value = (state.data && state.data.reference_date) || '2026-06-30';
  row.appendChild(el('span', 'muted', 'From'));
  row.appendChild(start);
  row.appendChild(el('span', 'muted', 'to'));
  row.appendChild(end);

  if (N8N_WEBHOOK_URL) {
    const go = el('button', 'primary', 'Run report');
    go.addEventListener('click', () => {
      if (!start.value || !end.value) {
        // The panel stays open on a validation failure — the reader has to come
        // back to it, so closing it would be taking the form away mid-correction.
        return notice('warn', 'Both dates are needed', 'Pick a start and an end date, then press Run report.');
      }
      closeCustom();
      triggerRun({ period: 'custom', start: start.value, end: end.value }, { label: 'Running…' });
    });
    row.appendChild(go);
  }

  const show = el('button', null, 'Show latest custom run');
  show.addEventListener('click', () => { closeCustom(); loadPeriod('custom'); });
  row.appendChild(show);
  panel.appendChild(row);

  panel.appendChild(el('div', 'hint', N8N_WEBHOOK_URL
    ? 'The sample sources cover January 2025 to June 2026 and the report is anchored to 30 June 2026, ' +
      'so a range after that comes back empty.'
    : 'This deployment is read-only, so it shows the most recent custom run rather than starting a new one.'));

  panel.hidden = false;
  if (btn) btn.setAttribute('aria-expanded', 'true');
  start.focus();
}

// Outside click and Escape close it, like any other popover on the page.
document.addEventListener('click', (e) => {
  const panel = $('customPanel');
  if (!panel || panel.hidden) return;
  if (panel.contains(e.target) || e.target === customBtn()) return;
  closeCustom();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCustom(); });

// ---- boot ---------------------------------------------------
document.querySelectorAll('#controls button[data-period]').forEach((b) => {
  b.addEventListener('click', () => {
    if (b.dataset.period === 'custom') {
      state.period = 'custom';
      document.querySelectorAll('#controls button[data-period]').forEach((x) =>
        x.setAttribute('aria-pressed', String(x === b)));
      askCustom();
    } else {
      loadPeriod(b.dataset.period);
    }
  });
});

loadPeriod('last_30d');
</script>
</body>
</html>
