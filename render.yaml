# Two long-running services, one Supabase project.
#
# The split is not tidiness. The shareable link is graded, and a dead link is an
# unmarkable submission. If the agent OOMs or the native binary fails to
# resolve, the worker dies and `web` keeps serving every run that already
# completed. A single-process deployment loses the link along with the agent.
#
# SECRETS are `sync: false` and set in the dashboard. BUDGETS AND MODEL CHOICES
# ARE COMMITTED AS VALUES, deliberately. They are not secret, and on 2026-09-25
# three separate debugging sessions were lost to a process enforcing numbers
# that no longer matched the file anyone was reading. A value in git can be
# diffed, reviewed and blamed. A value only in a dashboard cannot.
services:
  - type: web
    name: koya-lead-desk-web
    runtime: node
    rootDir: 5-lead_outreach/build
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    # Migrations run here and ONLY here. Both services share one database, so
    # running them from both invites two migrators racing on a first deploy.
    # Deploy web before worker: the worker will query columns this creates.
    preDeployCommand: npm run migrate
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: APP_BASE_URL
        sync: false

      # Written into every new run row by the intake route, so the web service
      # decides what a run is allowed to spend before the worker ever sees it.
      - key: RUN_CANDIDATE_BUDGET
        value: "40"
      - key: RUN_SCRAPE_BUDGET
        value: "30"
      - key: RUN_APIFY_CAP_USD
        value: "0.30"

      # ---------------------------------------------------------------------
      # A PROVIDER KEY ON THE WEB SERVICE, WHICH THIS FILE PREVIOUSLY PROMISED
      # NOT TO HAVE.
      #
      # "Write the copy again" lets a reviewer ask for outreach on a lead the
      # gates blocked, and `lib/drafting.ts` calls Anthropic directly from the
      # request. That is convenient and it weakens the original posture: the
      # web service is the internet-facing one, and it can now leak a key it
      # holds.
      #
      # The alternative is to make the button enqueue work and let the worker
      # draft, which keeps every provider key off the public surface at the
      # cost of a second poll loop and a slower button. If that posture matters
      # more than the latency, do that instead and delete these four entries.
      # ---------------------------------------------------------------------
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AGENT_MODEL
        value: claude-sonnet-5
      - key: AGENT_MAX_BUDGET_USD
        value: "2.00"
      - key: DAILY_CLAUDE_CAP_USD
        value: "10.00"

  - type: worker
    name: koya-lead-desk-worker
    runtime: node
    rootDir: 5-lead_outreach/build
    plan: starter
    # NOT `npm ci --omit=optional`: the Agent SDK ships its native binary through
    # npm optional dependencies, and omitting them leaves no binary to spawn.
    buildCommand: npm ci
    startCommand: npm run worker
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: N8N_LEAD_NOTIFY_URL
        sync: false
      - key: N8N_LEAD_NOTIFY_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFY_TO
        sync: false
      - key: APP_BASE_URL
        sync: false

      # Identity, asserted at boot. A personal token here spends somebody
      # else's share of a cohort account.
      - key: APIFY_EXPECTED_ACCOUNT
        sync: false

      # Models. The screen is a different model from the one it protects, on
      # purpose: a payload tuned to manipulate the agent is not automatically
      # tuned to manipulate its screener.
      - key: AGENT_MODEL
        value: claude-sonnet-5
      - key: SCREEN_MODEL
        value: claude-haiku-4-5
      # Output is where this agent's money goes. Measured on 2026-09-25: 48% of
      # spend on output tokens against 44 tokens of uncached input.
      - key: AGENT_EFFORT
        value: medium

      # What one run may spend, and what a day may spend across all of them.
      # DAILY_CLAUDE_CAP_USD must stay ABOVE AGENT_MAX_BUDGET_USD or no run can
      # ever start; the worker refuses at boot and names both settings.
      - key: AGENT_MAX_TURNS
        value: "60"
      - key: AGENT_MAX_BUDGET_USD
        value: "2.00"
      - key: DAILY_CLAUDE_CAP_USD
        value: "10.00"
      - key: RUN_CANDIDATE_BUDGET
        value: "40"
      - key: RUN_SCRAPE_BUDGET
        value: "30"
      - key: RUN_APIFY_CAP_USD
        value: "0.30"
      - key: DAILY_APIFY_CAP_USD
        value: "1.50"

      # Searches. The ceiling only catches a loop; the empty streak is the real
      # control, because counting searches punishes a run for an actor
      # returning nothing.
      - key: RUN_DISCOVERY_CALLS
        value: "40"
      - key: RUN_DISCOVERY_ZERO_STREAK
        value: "4"

      # The pinned actor, and its price read from the Apify API rather than its
      # listing page. This MUST be the full-company rate, because the call pins
      # scraperMode to 'full'. See build/DISCOVERY.md.
      - key: APIFY_ACTOR_ID
        value: harvestapi/linkedin-company-search
      - key: APIFY_ACTOR_PRICE_PER_RESULT_USD
        value: "0.004"
      - key: APIFY_ACTOR_START_USD
        value: "0.001"

      # How long a scraped page stays good enough to judge a company on.
      - key: SCRAPE_CACHE_MAX_AGE_DAYS
        value: "30"

      - key: NOTIFY_FROM_EMAIL
        sync: false
